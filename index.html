<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>De Olho no Lixo da Ilha — Mapa</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Segoe UI',sans-serif;background:#f5f5f0;color:#2d3748;}
header{background:#1a4731;color:#fff;padding:14px 20px;display:flex;align-items:center;gap:14px;box-shadow:0 2px 8px rgba(0,0,0,.2);}
header h1{font-size:1.1rem;font-weight:700;line-height:1.2;}
header p{font-size:0.72rem;opacity:.8;}
.bar{display:flex;gap:8px;padding:10px 16px;background:#fff;border-bottom:1px solid #e0ddd5;flex-wrap:wrap;align-items:center;}
.btn-t{padding:6px 16px;border-radius:20px;border:1.5px solid #1a4731;background:#fff;color:#1a4731;font-size:0.8rem;cursor:pointer;font-weight:600;transition:all .15s;}
.btn-t.on{background:#1a4731;color:#fff;}
.chips{display:flex;gap:6px;margin-left:auto;flex-wrap:wrap;}
.chip{font-size:0.72rem;padding:4px 10px;border-radius:12px;background:#e8f5e9;color:#166534;font-weight:600;}
.chip.ag{background:#e0f2fe;color:#0369a1;}
#map{width:100%;height:calc(100vh - 108px);}
.legenda{position:absolute;bottom:28px;left:12px;background:#fff;padding:10px 14px;border-radius:10px;font-size:0.74rem;z-index:1000;line-height:1.9;max-width:185px;box-shadow:0 2px 10px rgba(0,0,0,.12);border:1px solid #e0ddd5;}
.legenda b{font-size:0.65rem;color:#718096;text-transform:uppercase;letter-spacing:.4px;display:block;margin-top:6px;margin-bottom:1px;}
.legenda b:first-child{margin-top:0;}
.load{position:absolute;inset:0;background:rgba(255,255,255,.92);display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:2000;gap:12px;font-size:1rem;color:#1a4731;text-align:center;padding:20px;}
.spin{width:36px;height:36px;border:4px solid #e0ddd5;border-top-color:#1a4731;border-radius:50%;animation:sp 1s linear infinite;}
@keyframes sp{to{transform:rotate(360deg)}}

/* Ícones confiáveis */
.custom-pin{background:transparent!important;border:none!important;}
.pin-body{
  width:32px;height:32px;border-radius:50% 50% 50% 0;
  transform:rotate(-45deg);border:2.5px solid #fff;
  box-shadow:0 2px 6px rgba(0,0,0,.35);
  display:flex;align-items:center;justify-content:center;
}
.pin-emoji{transform:rotate(45deg);font-size:15px;line-height:1;}
.pin-limpo .pin-emoji{font-size:16px;}
.pin-lixo_poda .pin-emoji{font-size:12px;}
</style>
</head>
<body>
<header>
  <div>
    <h1>👁 De Olho no Lixo da Ilha</h1>
    <p>Mapa interativo de fiscalização — Itamaracá-PE</p>
  </div>
</header>
<div class="bar">
  <button class="btn-t on" id="btn-al" onclick="setModo('alunos')">👤 Alunos</button>
  <button class="btn-t" id="btn-ag" onclick="setModo('agentes')">👷 Agentes</button>
  <button class="btn-t" id="btn-amb" onclick="setModo('ambos')">🌍 Ambos</button>
  <div style="width:1px;background:#ddd;margin:0 4px;align-self:stretch;"></div>
  <button class="btn-t on" id="filt-todos" onclick="setFiltroTipo('todos')">Todos</button>
  <button class="btn-t" id="filt-lixo" onclick="setFiltroTipo('lixo')">🗑 Lixo</button>
  <button class="btn-t" id="filt-poda" onclick="setFiltroTipo('poda')">🌳 Poda</button>
  <button class="btn-t" id="filt-lixo_poda" onclick="setFiltroTipo('lixo_poda')">🌳🗑 Lixo+Poda</button>
  <div class="chips">
    <span class="chip" id="stat-al">0 pontos alunos</span>
    <span class="chip ag" id="stat-ag">0 pontos agentes</span>
  </div>
</div>
<div style="position:relative;">
  <div id="map"></div>
  <div class="load" id="load"><div class="spin"></div><span>Carregando dados...</span></div>
  <div class="legenda" id="leg"></div>
</div>

<script>
const SHEET_ID = '1Q9hG2uVnnP0kbKCdiVjUWwhW6Bi9TjajEYXS0dlZMsk';
const ABA_ALUNOS = 'Coordenadas';
const ABA_AGENTES = 'Agentes';
const COR_ALUNO = '#e53e3e';

let map, _modo = 'alunos', _camAl = null, _camAg = null;
let _filtroTipo = 'todos';
let _dadosAl = [], _dadosAg = [];

function setFiltroTipo(tipo) {
  _filtroTipo = tipo;
  ['todos','lixo','poda','lixo_poda'].forEach(t => {
    document.getElementById('filt-'+t)?.classList.toggle('on', t === tipo);
  });
  _reaplicarCamadas();
}

function _filtrarPontos(lista) {
  if (_filtroTipo === 'todos') return lista;
  return lista.filter(p => (p.tipo_residuo || 'lixo') === _filtroTipo);
}

function _reaplicarCamadas() {
  if (!map) return;
  if (_camAl) map.removeLayer(_camAl);
  if (_camAg) map.removeLayer(_camAg);
  _camAl = camadaAlunos(_filtrarPontos(_dadosAl));
  _camAg = camadaAgentes(_filtrarPontos(_dadosAg));
  if (_modo !== 'agentes') _camAl.addTo(map);
  if (_modo !== 'alunos')  _camAg.addTo(map);
  atualizarLegenda();
}

// Ícones novos (funcionam em qualquer navegador)
function pinHTML(cor, tipo) {
  const emojis = { lixo:'🗑', poda:'🌳', lixo_poda:'🌳🗑', limpo:'✓', analise:'⚠' };
  const emoji = emojis[tipo] || '🗑';
  const extra = tipo === 'limpo' ? 'pin-limpo' : (tipo === 'lixo_poda' ? 'pin-lixo_poda' : '');
  return `<div class="pin-body ${extra}" style="background:${cor}"><span class="pin-emoji">${emoji}</span></div>`;
}

function icone(cor, tipo) {
  return L.divIcon({
    className: 'custom-pin',
    html: pinHTML(cor, tipo),
    iconSize: [32, 42],
    iconAnchor: [16, 42],
    popupAnchor: [0, -40]
  });
}

function tipoAg(st, tp) {
  if (st === 'limpo') return 'limpo';
  if (st === 'analise_operador') return 'analise';
  return tp || 'lixo';
}

// Validação de coordenadas (só aceita pontos próximos de Itamaracá)
function coordValida(lat, lon) {
  return !isNaN(lat) && !isNaN(lon) &&
         lat > -8.2 && lat < -7.4 &&
         lon > -35.1 && lon < -34.5;
}

async function lerAba(aba) {
  const url = `https://docs.google.com/spreadsheets/d/${SHEET_ID}/gviz/tq?tqx=out:json&sheet=${encodeURIComponent(aba)}`;
  const res = await fetch(url);
  if (!res.ok) throw new Error(`HTTP ${res.status} na aba ${aba}`);
  const txt = await res.text();
  const json = JSON.parse(txt.replace(/^[^\(]+\(/, '').replace(/\);?\s*$/, ''));
  if (!json.table) throw new Error('Tabela não encontrada');

  const cols = (json.table.cols || []).map(c => (c.label || '').toString().trim());
  return (json.table.rows || []).map(row => {
    const o = {};
    cols.forEach((c, i) => {
      const val = row.c?.[i] ? (row.c[i].v ?? row.c[i].f ?? '') : '';
      o[c] = val;
      o[c.toLowerCase()] = val;
    });

    o.latitude  = parseFloat(o.latitude  || o.lat || '');
    o.longitude = parseFloat(o.longitude || o.lng || o.lon || '');
    o.grupo     = o.grupo || '';
    o.tipo_residuo = (o.tipo_residuo || o.tipo || 'lixo').toString().toLowerCase();
    o.status    = (o.status || 'novo_ponto').toString().toLowerCase();
    o.foto      = o.foto || '';
    o.data      = o.data || '';
    o.hora      = o.hora || '';

    // fotos
    const urls = [];
    let n = 1;
    while (o['foto_url_' + n] !== undefined) {
      if (o['foto_url_' + n]) urls.push(o['foto_url_' + n]);
      n++;
    }
    if (!urls.length && o.foto_url) urls.push(o.foto_url);
    o._foto_urls = urls;

    return o;
  });
}

function criarImgComFallback(urls, style) {
  if (!urls?.length) return '<div style="background:#f7fafc;padding:10px;text-align:center;font-size:11px;color:#718096;">Foto não disponível</div>';
  const id = 'img_' + Math.random().toString(36).slice(2,8);
  const urlsJson = JSON.stringify(urls).replace(/"/g, '&quot;');
  return `<img id="${id}" src="${urls[0]}" style="${style}" onerror="(function(el,urls,idx){if(idx<urls.length){el.src=urls[idx];el.onerror=function(){(arguments.callee)(el,urls,idx+1)}}else{el.outerHTML='<div style=&quot;padding:10px;text-align:center;font-size:11px;color:#718096&quot;>Foto indisponível</div>'}})(this,${urlsJson},1)">`;
}

function camadaAlunos(rows) {
  const layer = L.layerGroup();
  let count = 0;
  rows.forEach(r => {
    if (!coordValida(r.latitude, r.longitude)) return;
    count++;
    const tipo = r.tipo_residuo || 'lixo';
    const fotoHtml = criarImgComFallback(r._foto_urls, 'width:100%;max-height:180px;object-fit:cover;border-radius:4px 4px 0 0;display:block;');
    const popup = `<div style="min-width:200px;">
      ${fotoHtml}
      <div style="background:${COR_ALUNO};color:#fff;font-weight:700;padding:6px 12px;font-size:12px;">📍 Grupo ${r.grupo||'--'}</div>
      <div style="padding:8px 12px;font-size:12px;line-height:1.9;">
        <b>Foto:</b> ${r.foto||'--'}<br>
        <b>Tipo:</b> ${({'lixo':'Lixo','poda':'Poda','lixo_poda':'Lixo+poda'}[tipo]||tipo)}<br>
        <b>Data:</b> ${r.data||'--'} ${r.hora||''}<br>
        <b>Coord.:</b> ${r.latitude.toFixed(6)}, ${r.longitude.toFixed(6)}
      </div></div>`;
    L.marker([r.latitude, r.longitude], {icon: icone(COR_ALUNO, tipo), zIndexOffset:1000})
      .bindPopup(popup, {maxWidth:240}).addTo(layer);
  });
  console.log('Alunos válidos marcados:', count);
  return layer;
}

function camadaAgentes(rows) {
  const layer = L.layerGroup();
  const cores = {novo_ponto:'#e53e3e', recorrencia:'#d69e2e', limpo:'#38a169', analise_operador:'#d69e2e'};
  const labels = {novo_ponto:'Ponto sem registro', recorrencia:'Recorrência', limpo:'Local limpo', analise_operador:'Recorrência'};
  const tipos = {lixo:'Lixo', poda:'Poda', lixo_poda:'Lixo+poda'};
  let count = 0;

  rows.forEach(r => {
    if (!coordValida(r.latitude, r.longitude)) return;
    count++;
    const st = r.status || 'novo_ponto';
    const cor = cores[st] || '#718096';
    const fotoHtml = criarImgComFallback(r._foto_urls, 'width:100%;max-height:180px;object-fit:cover;border-radius:4px 4px 0 0;display:block;');
    const popup = `<div style="min-width:200px;">
      ${fotoHtml}
      <div style="background:${cor};color:#fff;font-weight:700;padding:6px 12px;font-size:12px;">👷 Fiscal — ${labels[st]||st}</div>
      <div style="padding:8px 12px;font-size:12px;line-height:1.9;">
        <b>Foto:</b> ${r.foto||'--'}<br>
        <b>Tipo:</b> ${tipos[r.tipo_residuo]||'--'}<br>
        <b>Data:</b> ${r.data||'--'} ${r.hora||''}<br>
        <b>Coord.:</b> ${r.latitude.toFixed(6)}, ${r.longitude.toFixed(6)}
      </div></div>`;
    L.marker([r.latitude, r.longitude], {icon: icone(cor, tipoAg(st, r.tipo_residuo)), zIndexOffset:1000})
      .bindPopup(popup, {maxWidth:260}).addTo(layer);
  });
  console.log('Agentes válidos marcados:', count);
  return layer;
}

function setModo(modo) {
  _modo = modo;
  ['alunos','agentes','ambos'].forEach(m => {
    const id = 'btn-' + m.replace('alunos','al').replace('agentes','ag').replace('ambos','amb');
    document.getElementById(id)?.classList.toggle('on', m === modo);
  });
  if (_camAl) map.removeLayer(_camAl);
  if (_camAg) map.removeLayer(_camAg);
  if (modo !== 'agentes' && _camAl) _camAl.addTo(map);
  if (modo !== 'alunos'  && _camAg) _camAg.addTo(map);
  atualizarLegenda();
}

function atualizarLegenda() {
  const el = document.getElementById('leg');
  let h = '';
  if (_modo !== 'agentes') {
    h += '<b>Alunos</b><div><span style="color:#e53e3e">●</span> Pontos dos alunos</div>';
    h += '<b>Tipo resíduo</b><div>🗑 Lixo</div><div>🌳 Poda</div><div>🌳🗑 Lixo+poda</div>';
  }
  if (_modo !== 'alunos') {
    h += '<b>Fiscais</b>'
      + '<div><span style="color:#e53e3e">●</span> Ponto sem registro</div>'
      + '<div><span style="color:#d69e2e">●</span> Recorrência</div>'
      + '<div><span style="color:#38a169">●</span> Local limpo (✓)</div>';
  }
  el.innerHTML = h;
}

async function init() {
  map = L.map('map').setView([-7.748, -34.831], 13);
  L.tileLayer('https://{s}.basemaps.cartocdn.com/rastertiles/voyager/{z}/{x}/{y}{r}.png', {
    attribution: '© OpenStreetMap © CARTO', maxZoom: 19
  }).addTo(map);

  try {
    const [rAl, rAg] = await Promise.all([
      lerAba(ABA_ALUNOS).catch(e => { console.error(e); return []; }),
      lerAba(ABA_AGENTES).catch(e => { console.error(e); return []; })
    ]);

    _dadosAl = rAl;
    _dadosAg = rAg;

    document.getElementById('stat-al').textContent = rAl.length + ' pontos alunos';
    document.getElementById('stat-ag').textContent = rAg.length + ' pontos agentes';

    _reaplicarCamadas();

    // Só usa pontos com coordenadas válidas para o enquadramento
    const todos = [...rAl, ...rAg]
      .filter(r => coordValida(r.latitude, r.longitude))
      .map(r => [r.latitude, r.longitude]);

    if (todos.length) {
      map.fitBounds(L.latLngBounds(todos), { padding: [40, 40], maxZoom: 16 });
    }

    document.getElementById('load').style.display = 'none';
    console.log('Total pontos válidos:', todos.length);

  } catch (e) {
    console.error(e);
    document.getElementById('load').innerHTML = `<div style="font-size:2rem">⚠</div><b>Erro ao carregar</b><p style="font-size:0.85rem;margin-top:8px">${e.message}</p>`;
  }
}

window.addEventListener('load', init);
</script>
</body>
</html>
